<!DOCTYPE html>
<html>
<head>
    <title>Bug WA Xbarxz</title>
    <style>
        body {
            background: #fce4ec;
            font-family: Arial;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .apk-container {
            width: 320px;
            height: 600px;
            background: linear-gradient(#ec407a, #d81b60);
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .apk-notch {
            width: 150px;
            height: 25px;
            background: #d81b60;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .apk-header {
            text-align: center;
            margin-top: 30px;
            color: white;
        }
        .apk-logo {
            width: 80px;
            height: 80px;
            background: #f06292;
            border-radius: 50%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: white;
            border: 3px solid #ffffff;
        }
        .apk-nama {
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .apk-subnama {
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.8;
        }
        .apk-body {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            height: 350px;
            box-sizing: border-box;
        }
        .apk-label {
            color: #d81b60;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
        }
        .apk-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #f8bbd0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            color: #d81b60;
            text-align: center;
        }
        .apk-input::placeholder {
            color: #f8bbd0;
            text-align: center;
        }
        .apk-menu {
            background: linear-gradient(#f8bbd0, #ec407a);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            border: none;
            width: 100%;
            cursor: pointer;
        }
        .apk-menu:active {
            background: linear-gradient(#ec407a, #f8bbd0);
        }
        .apk-footer {
            text-align: center;
            color: white;
            font-size: 12px;
            margin-top: 15px;
            opacity: 0.7;
        }
        .apk-notice {
            background: #ffebee;
            color: #b71c1c;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            display: block;
        }
        .hidden {
            display: none !important;
        }
        .apk-success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="apk-container">
        <!-- Notch Atas -->
        <div class="apk-notch"></div>

        <!-- Header Aplikasi -->
        <div class="apk-header">
            <div class="apk-logo">XZ</div>
            <div class="apk-nama">Akbarxz Xbarxz</div>
            <div class="apk-subnama">Bug WA V1.0</div>
        </div>

        <!-- Body Aplikasi -->
        <div class="apk-body">
            <div class="apk-notice">⚠️ SILAKAN ISI DATA UNTUK PROSES!</div>

            <label id="label-nama" class="apk-label">NAMA TARGET</label>
            <input type="text" id="input-nama" class="apk-input" placeholder="Masukkan nama target">

            <label id="label-nomor" class="apk-label">NOMOR HP / KODE ANGKAA</label>
            <input type="number" id="input-nomor" class="apk-input" placeholder="Contoh: 62812xxxx atau kode angka">

            <label id="label-bug" class="apk-label">PILIH JENIS BUG</label>
            <select id="select-bug" class="apk-input" style="text-align-last:center;">
                <option>Bug Crash WA</option>
                <option>Bug Pesan Terulang</option>
                <option>Bug Tampilan WA</option>
                <option>Bug Stiker WA</option>
            </select>

            <button class="apk-menu" onclick="sendBug()">📤 SEND BUG WA</button>
            <button class="apk-menu" onclick="resetForm()">🔄 RESET SEMUA</button>

            <!-- Pesan Konfirmasi -->
            <div id="pesan-sukses" class="apk-success">✅ PROSES SELESAI! SEMUA DATA DIHAPUS!</div>
        </div>

        <!-- Footer Aplikasi -->
        <div class="apk-footer">
            © 2024 Akbarxz Xbarxz • ALL RIGHTS RESERVED
        </div>
    </div>


    <script>
        // FUNGSI UTAMA
        function sendBug() {
            let nama = document.getElementById('input-nama').value;
            let nomor = document.getElementById('input-nomor').value;

            if(nama == "" || nomor == "") {
                alert("⚠️ Isi nama dan nomor dulu ya!");
            } else {
                // Tampilkan pesan sukses
                alert(`✅ BUG DIKIRIM KE ${nama} (${nomor})!\n✅ PROSES BERJALAN, SEMUA DATA AKAN DIHAPUS!`);
                
                // HILANGKAN SEMUA INPUT, LABEL, DAN NOTIF AWAL
                document.querySelector('.apk-notice').classList.add('hidden');
                document.getElementById('label-nama').classList.add('hidden');
                document.getElementById('input-nama').classList.add('hidden');
                document.getElementById('label-nomor').classList.add('hidden');
                document.getElementById('input-nomor').classList.add('hidden');
                document.getElementById('label-bug').classList.add('hidden');
                document.getElementById('select-bug').classList.add('hidden');
                
                // Tampilkan pesan sukses
                document.getElementById('pesan-sukses').style.display = "block";
            }
        }

        function resetForm() {
            // Kembalikan semua tampilan
            document.querySelector('.apk-notice').classList.remove('hidden');
            document.getElementById('label-nama').classList.remove('hidden');
            document.getElementById('input-nama').classList.remove('hidden');
            document.getElementById('label-nomor').classList.remove('hidden');
            document.getElementById('input-nomor').classList.remove('hidden');
            document.getElementById('label-bug').classList.remove('hidden');
            document.getElementById('select-bug').classList.remove('hidden');
            document.getElementById('pesan-sukses').style.display = "none";
            
            // Kosongkan input
            document.getElementById('input-nama').value = "";
            document.getElementById('input-nomor').value = "";
            document.getElementById('select-bug').selectedIndex = 0;
            
            alert("🔄 FORM DIRESET! SEMUA DATA KEMBALI!");
        }
    </script>

</body>
</html>
